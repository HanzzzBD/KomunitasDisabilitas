<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nawasena">
  <!--
    IKON SEMENTARA — aset desain, bukan rekayasa.

    Bentuknya sengaja netral (huruf awal pada latar solid) supaya jelas bahwa
    ini belum identitas visual produk. Ikon sesungguhnya perlu desainer, dan
    perlu varian PNG 192/512 untuk iOS yang belum menerima SVG di manifest.
    Tercatat sebagai utang di log implementasi PR-025d.

    Kontras teks/latar 12,6:1 — jauh di atas ambang WCAG 2.2 AA (4,5:1),
    supaya ia tetap terbaca saat sistem operasi mengecilkannya.
  -->
  <rect width="512" height="512" rx="96" fill="#1f2937" />
  <text
    x="256"
    y="256"
    font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    font-size="280"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="central"
  >N</text>
</svg>
