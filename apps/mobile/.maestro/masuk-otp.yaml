# Alur masuk OTP PR-090 — dijalankan manual di device/emulator berisi APK internal
# yang menunjuk API dengan sender uji (kode OTP terbaca dari log sender, bukan SMS):
#   maestro test -e NOMOR=081234567890 -e KODE=123456 apps/mobile/.maestro/masuk-otp.yaml
# Belum di CI: butuh emulator Android + API staging (Phase 16).
appId: id.nawasena.app
---
- launchApp:
    clearState: true
- assertVisible:
    id: "layar-masuk"
- tapOn:
    id: "masukan-nomor"
- inputText: ${NOMOR}
- tapOn:
    id: "tombol-kirim-kode"
- assertVisible:
    id: "layar-verifikasi"
- tapOn:
    id: "masukan-kode"
- inputText: ${KODE}
- tapOn:
    id: "tombol-masuk"
- assertVisible:
    id: "layar-beranda"
# Sesi bertahan restart: tanpa clearState, app langsung kembali ke Beranda.
- stopApp
- launchApp
- assertVisible:
    id: "layar-beranda"
# Keluar → kembali ke layar masuk, dan restart tidak memulihkan sesi.
- tapOn:
    id: "tombol-keluar"
- tapOn:
    id: "tombol-keluar-yakin"
- assertVisible:
    id: "layar-masuk"
- stopApp
- launchApp
- assertVisible:
    id: "layar-masuk"
