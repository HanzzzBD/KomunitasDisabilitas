# CI PR Checks — lint (termasuk boundaries), typecheck, unit test (ADR-016, PR-003).
#
# Semua check WAJIB hijau sebelum merge (branch protection required checks).
# Slot job e2e & a11y disiapkan non-blocking; diaktifkan di PR-031.
# Tanpa secrets produksi; permission least-privilege (contents: read).

name: PR Checks

on:
  pull_request:
    branches: [main, "phase-*"]

permissions:
  contents: read

# Push baru ke branch PR yang sama membatalkan run lama (hemat menit runner).
concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint-typecheck-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres service (PR-009): migrate reset + seed + integration test DB.
    # Image sama dengan compose dev — hindari drift versi.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: nawasena
          POSTGRES_PASSWORD: nawasena
          POSTGRES_DB: nawasena
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nawasena -d nawasena"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis queue (PR-015b): integration test retry/backoff/DLQ/drain.
      # Image & port sama dengan compose dev. Tanpa --maxmemory, default Redis
      # adalah noeviction — syarat BullMQ (ADR-004) terpenuhi tanpa flag
      # tambahan (service container GitHub tidak menerima argumen command).
      redis-queue:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nawasena:nawasena@localhost:5433/nawasena
      REDIS_QUEUE_URL: redis://localhost:6380
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # corepack membaca field "packageManager" di package.json (pnpm@9.15.0 pinned).
      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Setup Node 20 + cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Cache turbo (turbo 2.x default cache dir = .turbo/cache):
      # run kedua dengan input sama memakai hasil cache (< 50% durasi).
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma client harus ter-generate sebelum typecheck/test — tanpa ini
      # tipe @prisma/client hanyalah stub kosong (TS2347/TS2339).
      - name: Prisma generate
        run: pnpm --filter @nawasena/api exec prisma generate

      # Lint mencakup eslint-plugin-boundaries — pelanggaran arsitektur = CI merah.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # AC PR-009: migrate reset + seed hijau di CI (Postgres service).
      # Menjalankan seluruh migrasi dari nol + seed admin idempotent.
      - name: Prisma migrate reset + seed
        run: pnpm --filter @nawasena/api exec prisma migrate reset --force

      - name: Unit test
        run: pnpm test

      # Diagnostik kegagalan test — HANYA berjalan saat langkah di atas merah.
      #
      # Lahir dari kejadian nyata (2026-08-08, PR #59): satu worker vitest mati
      # dengan "Worker exited unexpectedly" tanpa satu pun galat JavaScript, dan
      # jalan ulang tanpa perubahan apa pun langsung hijau. Penyebabnya TIDAK
      # bisa ditentukan, karena dua sumber bukti yang paling menentukan tidak
      # pernah masuk log job:
      #
      #   1. Pesan OOM killer kernel — ia menulis ke log kernel, bukan ke stdout
      #      job. Absennya kata "killed" di log karena itu BUKAN bukti bukan-OOM.
      #   2. Log kontainer service (postgres/redis) — GitHub hanya menampilkan
      #      langkah penyiapannya, bukan keluaran runtime-nya.
      #
      # Langkah ini menutup keduanya, supaya kejadian kedua menghasilkan DATA
      # alih-alih dugaan. Sengaja tidak menambal apa pun: tambalan atas sebab
      # yang belum diketahui bisa menghilangkan gejalanya tanpa menghilangkan
      # masalahnya — dan menghabiskan satu-satunya kesempatan belajar.
      #
      # `|| true` di tiap perintah: diagnostik tidak boleh mengubah sebab
      # kegagalan yang sedang dilaporkan.
      - name: Diagnostik kegagalan test
        if: failure()
        run: |
          echo "::group::Memori & disk"
          free -m || true
          df -h || true
          echo "::endgroup::"

          echo "::group::Jejak OOM killer (kernel)"
          # Inilah bukti yang hilang pada kejadian pertama.
          sudo dmesg -T 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20 || echo "(dmesg tidak terbaca / tidak ada jejak OOM)"
          echo "::endgroup::"

          echo "::group::Kontainer service"
          docker ps -a || true
          for c in $(docker ps -aq); do
            echo "--- docker logs $c (200 baris terakhir) ---"
            docker logs --tail 200 "$c" 2>&1 || true
          done
          echo "::endgroup::"

      # Drift kontrak: openapi.json wajib sinkron dengan skema zod (PR-004).
      - name: OpenAPI drift check
        run: pnpm --filter @nawasena/schemas check:openapi

      # AC PR-025: budget JS awal < 200 KB gzip (SDD §4.5).
      # Dipasang selagi bundelnya masih ~45 KB — penjaga yang lahir setelah
      # bundelnya gemuk hanya akan mengesahkan keadaan yang sudah terlanjur.
      # Build-nya sendiri juga berguna: ia membuktikan apps/web benar-benar bisa
      # dibangun untuk produksi, bukan hanya lolos typecheck.
      - name: Build web + cek budget bundle
        run: pnpm --filter @nawasena/web build && pnpm --filter @nawasena/web cek:budget

  # ---- Slot non-blocking (diaktifkan PR-031) ----
  # `if: false` = job tidak pernah jalan, tapi struktur & nama check sudah dipesan
  # sehingga PR-031 cukup mengganti kondisi + mengisi langkah.
  e2e:
    name: e2e (slot — aktif di PR-031)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Slot e2e — alur pengguna end-to-end; masih slot (lihat catatan PR-031b)."

  # Gerbang aksesibilitas LAPIS KETIGA (PR-031b) — axe + Lighthouse atas halaman
  # nyata di peramban nyata.
  #
  # JOB TERPISAH, bukan langkah tambahan di `checks`, dengan dua alasan:
  #   1. Ia butuh peramban (± 1 menit unduhan + dependensi sistem) yang tidak
  #      ada gunanya bagi lint/typecheck/unit.
  #   2. Berjalan PARALEL, sehingga tambahan durasi pipeline mendekati nol —
  #      AC PR-031 nomor 5 ("< 5 menit").
  #
  # TIDAK membutuhkan Postgres/Redis: jaringannya dipalsukan di dalam test
  # (lihat `palsukanApi` di e2e/aksesibilitas.spec.ts). Gerbang tampilan yang
  # bergantung pada basis data akan merah karena sebab yang bukan aksesibilitas
  # — dan gerbang yang merah karena sebab lain akan diabaikan orang.
  a11y:
    # NAMA CHECK SENGAJA POLOS: `a11y`, tanpa spasi maupun tanda kurung.
    #
    # Required status check dicocokkan sebagai STRING. Nama sebelumnya
    # ("a11y (axe + Lighthouse)") memang lebih deskriptif di daftar check,
    # tetapi setiap penyuntingan namanya — bahkan sekadar merapikan tanda
    # baca — akan DIAM-DIAM melepas kewajibannya di ruleset: GitHub tidak
    # menghubungkan keduanya, jadi yang tersisa adalah aturan yang menunggu
    # check bernama lama yang tidak pernah lagi dilaporkan, dan PR yang
    # menggantung tanpa sebab yang terlihat.
    #
    # Nama pendek yang tidak menyimpan detail implementasi (axe? Lighthouse?
    # keduanya?) tidak punya alasan untuk berubah saat isinya berubah.
    name: a11y
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Setup Node 20 + cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hanya chromium: axe dan Lighthouse sama-sama berjalan di atasnya, dan
      # menambah Firefox/WebKit melipatgandakan durasi tanpa menambah satu pun
      # aturan yang diperiksa.
      - name: Install Playwright chromium
        run: pnpm --filter @nawasena/web exec playwright install --with-deps chromium

      # Gerbang menguji HASIL BUILD, bukan server dev — kelas Tailwind yang
      # hilang dari produksi tampak baik-baik saja di server dev.
      - name: Build web
        run: pnpm --filter @nawasena/web build

      - name: axe atas halaman terdaftar
        run: pnpm --filter @nawasena/web test:a11y

      - name: Lighthouse (a11y = 100, perf >= 80)
        run: pnpm --filter @nawasena/web test:lighthouse

      # AC PR-032 nomor 1: perf >= 80 pada throttling 3G (ponsel).
      #
      # Jalan TERPISAH dari langkah di atas, bukan menggantikannya. Desktop di
      # jaringan cepat menjawab "apakah halamannya sehat"; ponsel di 3G menjawab
      # "apakah halamannya bisa dipakai orang yang benar-benar datang ke sini".
      # Halaman yang sama bisa lulus yang pertama dan gagal yang kedua — dan
      # yang kedua itulah keadaan sebagian besar pengguna yang dituju produk ini.
      - name: Lighthouse 3G (perf >= 80 pada ponsel)
        run: pnpm --filter @nawasena/web test:lighthouse:3g

      # Laporan hanya diunggah saat merah: yang membaca artefak ini adalah orang
      # yang sedang memperbaiki kegagalan, bukan orang yang PR-nya hijau.
      - name: Unggah laporan kegagalan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-a11y
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/.lighthouseci/
            apps/web/.lighthouseci-3g/
          retention-days: 7
